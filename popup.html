<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif; margin: 12px; width: 300px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #ccc; }
    button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #1f2430; color: #fff; cursor: pointer; font-weight: 600; }
    .muted { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>选中公式 → GeoGebra</h1>
  <p class="muted">右键可选：左侧分栏 / 迷你浮窗</p>
  <label>默认打开方式
    <select id="windowMode">
      <option value="embed">左侧分栏（页面对半）</option>
      <option value="float">迷你浮窗（可拖动缩放）</option>
    </select>
  </label>
  <label><input type="checkbox" id="enabled" /> 启用 AI 转换</label>
  <label><input type="checkbox" id="showLog" /> 打开时显示日志</label>
  <button type="button" id="options">打开设置（API Key）</button>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>视觉检查复杂不等式</title>
  <style>
    body { font: 13px sans-serif; margin: 8px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .col { border: 1px solid #999; }
    .mount { width: 420px; height: 320px; }
    h3 { margin: 6px 8px; font-size: 13px; }
  </style>
  <script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>
  <h1>左侧多项式 / 右侧复杂（等待渲染）</h1>
  <div class="row">
    <div class="col"><h3>x^2+y^2&lt;=4</h3><div id="a" class="mount"></div></div>
    <div class="col"><h3>sin(x)*sin(y)&gt;=0</h3><div id="b" class="mount"></div></div>
    <div class="col"><h3>星形不等式</h3><div id="c" class="mount"></div></div>
    <div class="col"><h3>边界等式 sin=0</h3><div id="d" class="mount"></div></div>
  </div>
  <pre id="out">…</pre>
  <script>
    function boot(id, cmds, done) {
      new GGBApplet({
        appName: 'graphing', width: 420, height: 320,
        showToolBar: false, showMenuBar: false, showAlgebraInput: false, allowUpscale: false,
        appletOnLoad(api) {
          try { api.setErrorDialogsActive(false) } catch (_) {}
          try { api.newConstruction() } catch (_) {}
          cmds.forEach((c) => { try { api.evalCommand(c) } catch (_) {} })
          try { api.setCoordSystem(-6, 6, -4.5, 4.5) } catch (_) {}
          setTimeout(() => {
            const names = api.getAllObjectNames() || []
            done({
              id,
              names: names.map((n) => ({
                n, type: api.getObjectType(n), vis: api.getVisible(n), def: api.isDefined(n),
              })),
            })
          }, 2500)
        },
      }, true).inject(id)
    }
    const reports = []
    window.__VISUAL__ = reports
    window.addEventListener('load', () => {
      let left = 4
      const finish = (r) => {
        reports.push(r)
        left--
        if (left === 0) document.getElementById('out').textContent = JSON.stringify(reports, null, 2)
      }
      boot('a', ['x^2+y^2<=4'], finish)
      boot('b', ['sin(x)*sin(y)>=0'], finish)
      boot('c', ['(abs(x)^2)^(1/3)+(abs(y)^2)^(1/3)<=1'], finish)
      boot('d', ['sin(x)*sin(y)=0'], finish)
    })
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>公式 → GeoGebra</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1f2430; color: #eee; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    #bar { padding: 8px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
    #bar button { cursor: pointer; }
    #frame-wrap { position: absolute; inset: 40px 0 0 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    #err { color: #ffb4b4; font-size: 12px; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>GeoGebra 独立窗口</strong>
    <span id="err"></span>
    <button type="button" id="reload">重新导入</button>
  </div>
  <div id="frame-wrap">
    <iframe id="ggb" title="GeoGebra" src="ggb-host.html?v=1.4.4" allow="clipboard-read; clipboard-write"></iframe>
  </div>
  <script src="ggb-panel.js"></script>
</body>
</html>
